name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # formatting is OS-independent; run once on the org Linux runners
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests scripts
      - name: Version markers agree
        run: sh scripts/version.sh check
      - name: Run selene
        run: |
          curl -fsSL -o /tmp/selene.zip https://github.com/Kampfkarren/selene/releases/download/0.31.0/selene-0.31.0-linux.zip
          unzip -o /tmp/selene.zip -d /tmp/selene-bin
          chmod +x /tmp/selene-bin/selene
          /tmp/selene-bin/selene lua plugin tests scripts

  test:
    strategy:
      fail-fast: false
      matrix:
        neovim: [stable, nightly]
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Install libsqlite3 (best effort; sqlite suites skip without it)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev || echo "libsqlite3 unavailable"
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: make test
