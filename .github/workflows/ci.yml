name: CI

on:
  push:
    branches: [main]
  pull_request:

# every step runs under bash, so a job landing on a Windows runner never
# feeds bash syntax to PowerShell
defaults:
  run:
    shell: bash

# GitHub-hosted runners only: this repo is public, and fork PRs
# must never execute on org self-hosted machines.
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, neovim: stable }
          - { runner: ubuntu-latest, neovim: nightly }
          - { runner: macos-latest, neovim: stable }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua plugin tests scripts
      - name: Version markers agree
        run: sh scripts/version.sh check
      - name: Run selene
        run: |
          case "${{ runner.os }}" in
            Linux) asset=selene-0.31.0-linux.zip ;;
            macOS) asset=selene-0.31.0-macos.zip ;;
          esac
          curl -fsSL -o /tmp/selene.zip "https://github.com/Kampfkarren/selene/releases/download/0.31.0/$asset"
          unzip -o /tmp/selene.zip -d /tmp/selene-bin
          chmod +x /tmp/selene-bin/selene
          /tmp/selene-bin/selene lua plugin tests scripts
      - name: Install libsqlite3 (Linux; sqlite suites skip without it)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev || echo "libsqlite3 unavailable"
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - run: make test
